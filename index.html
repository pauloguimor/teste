<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados – CNU2</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
body { margin:0; font-family: Arial, sans-serif; background:#f4f6f8; }

header {
  position: fixed;
  top: 0;
  width: 100%;
  background: #0b3c6d;
  color: white;
  padding: 10px;
  z-index: 1000;
}

header select, header input, header button {
  padding: 6px;
  margin: 4px;
  width: 100%;
}

header .linha {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

main {
  padding: 170px 10px 110px 10px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th {
  position: sticky;
  top: 0;
  background: #e9ecef;
}

td, th {
  border: 1px solid #ccc;
  padding: 6px;
}

footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #0b3c6d;
  color: white;
  text-align: center;
  padding: 6px;
  font-size: 13px;
}

footer button {
  margin-top: 5px;
  padding: 6px 12px;
  background: #28a745;
  border: none;
  color: white;
  border-radius: 4px;
}
</style>
</head>

<body>

<header>
  <h3>Resultados – CNU2</h3>

  <div class="linha">
    <select id="fCodigo"></select>
    <select id="fCargo"></select>
    <select id="fEspecialidade"></select>
  </div>

  <div class="linha">
    <button onclick="verResultado()">Ver resultado</button>
    <input id="fNome" placeholder="Pesquisar nome (após carregar)" disabled>
  </div>
</header>

<main>
  <div id="info"></div>
  <div style="overflow:auto; max-height:60vh;">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<footer>
  💙 Sua doação mantém o projeto ativo  
  <br>
  Pix: pauloguimor@yahoo.com.br  
  <br>
  <button onclick="copiarPix()">Copiar Pix</button>
</footer>

<script>
let dados = [];
let filtrados = [];

function normalizar(txt) {
  return txt?.toString()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

Papa.parse("dados_concurso.csv", {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: r => {
    dados = r.data;
    preencherFiltros();
  }
});

function preencherFiltros() {
  preencher("fCodigo", "CODIGO");
  preencher("fCargo", "CARGO");
  preencher("fEspecialidade", "ESPECIALIDADE");
}

function preencher(id, campo) {
  const sel = document.getElementById(id);
  sel.innerHTML = `<option value="">${campo}</option>`;
  [...new Set(dados.map(d => d[campo]).filter(Boolean))]
    .sort()
    .forEach(v => sel.add(new Option(v, v)));
}

function verResultado() {
  const c = fCodigo.value;
  const ca = fCargo.value;
  const e = fEspecialidade.value;

  filtrados = dados.filter(d =>
    (!c || d.CODIGO === c) &&
    (!ca || d.CARGO === ca) &&
    (!e || d.ESPECIALIDADE === e)
  );

  document.getElementById("fNome").disabled = false;
  render(filtrados);
}

document.getElementById("fNome").addEventListener("input", () => {
  const n = normalizar(fNome.value);
  render(filtrados.filter(d => normalizar(d.NOME).includes(n)));
});

function render(lista) {
  if (!lista.length) {
    tbody.innerHTML = "";
    info.innerText = "Nenhum resultado encontrado.";
    return;
  }

  const cols = Object.keys(lista[0]);
  thead.innerHTML = "<tr>" + cols.map(c => `<th>${c}</th>`).join("") + "</tr>";

  tbody.innerHTML = lista.map(l =>
    "<tr>" + cols.map(c => `<td>${l[c] ?? ""}</td>`).join("") + "</tr>"
  ).join("");

  info.innerText = `${lista.length} registros encontrados.`;
}

function copiarPix() {
  navigator.clipboard.writeText("pauloguimor@yahoo.com.br");
  alert("Pix copiado!");
}
</script>

</body>
</html>
